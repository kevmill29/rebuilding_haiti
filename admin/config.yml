# ════════════════════════════════════════════════════════════════════
#  Rebuilding Haiti — dashboard configuration
#
#  This file decides what the administrator sees when they log in at
#  yoursite.com/admin. Editing it is a developer job; the organizer
#  never needs to open it.
# ════════════════════════════════════════════════════════════════════

# ── STEP 1 of setup: sign-in ────────────────────────────────────────
# DecapBridge classic auth. The organizer signs in with an email and
# password and never needs a GitHub account.
backend:
  name: git-gateway
  repo: kevmill29/rebuilding_haiti
  branch: main
  identity_url: https://auth.decapbridge.com/sites/10f217e2-06fe-490f-9a73-19858758d889
  gateway_url: https://gateway.decapbridge.com

  # See who did what in the repository history
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# ── STEP 2 of setup: where uploaded photos go ───────────────────────
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://touninlakay.com
display_url: https://touninlakay.com
publish_mode: simple

collections:

  # ══════════════════════════════════════════════════════════════════
  # 1. MILESTONES — the wall on the home page
  # ══════════════════════════════════════════════════════════════════
  - name: milestones
    label: "Build progress"
    files:
      - name: milestones
        label: "Milestones and upcoming phases"
        file: "content/milestones.json"
        description: "Drag phases to reorder them. The home page counts how many are marked Completed."
        fields:
          - name: milestones
            label: "Construction phases"
            widget: list
            label_singular: "Phase"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { name: title,  label: "Phase name", widget: string }
              - { name: detail, label: "One-line description", widget: text, required: false }
              - name: status
                label: "Status"
                widget: select
                default: planned
                options:
                  - { label: "Completed", value: complete }
                  - { label: "Working on it now", value: next }
                  - { label: "Planned", value: planned }

  # ══════════════════════════════════════════════════════════════════
  # 2. GALLERY — photos and videos
  # ══════════════════════════════════════════════════════════════════
  - name: gallery
    label: "Photo and video gallery"
    files:
      - name: gallery
        label: "Gallery items"
        file: "content/gallery.json"
        description: "One list for both. Add a photo by dragging a file into the upload box, or add a video by pasting a YouTube link. The site sorts them automatically — photos show in the Photos section, videos show in their own Videos section."
        fields:
          - name: items
            label: "Gallery"
            widget: list
            label_singular: "Item"
            summary: "{{fields.caption}}"
            types:
              - name: photo
                label: "Photo"
                widget: object
                fields:
                  - { name: image,   label: "Photo", widget: image }
                  - { name: caption, label: "Caption", widget: string }
              - name: video
                label: "Video"
                widget: object
                fields:
                  - { name: video_url, label: "YouTube link", widget: string, pattern: ['youtu', "Paste a link that contains youtube.com or youtu.be"] }
                  - { name: caption,   label: "Caption", widget: string }

  # ══════════════════════════════════════════════════════════════════
  # 3. PROGRESS LOG — short news posts
  # ══════════════════════════════════════════════════════════════════
  - name: updates
    label: "Progress log"
    files:
      - name: updates
        label: "Posts"
        file: "content/updates.json"
        description: "Newest post first. Keep entries short — a paragraph or two and what happens next."
        fields:
          - name: posts
            label: "Posts"
            widget: list
            label_singular: "Post"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: date,  label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { name: body,  label: "What happened", widget: text }

  # ══════════════════════════════════════════════════════════════════
  # 4. SETTINGS — links, names, headline
  # ══════════════════════════════════════════════════════════════════
  - name: settings
    label: "Site settings"
    files:
      - name: site
        label: "Links and headline"
        file: "content/site.json"
        fields:
          - { name: donate_url,    label: "GoFundMe link", widget: string }
          - { name: video_id,      label: "YouTube video ID", widget: string, hint: "The part after v= in the YouTube address, e.g. zmePAFAUtg8" }
          - { name: organizer,     label: "Organizer name", widget: string }
          - { name: contact_email, label: "Contact email", widget: string }
          - { name: hero_eyebrow,  label: "Small line above the headline", widget: string, required: false }
          - { name: hero_headline, label: "Main headline", widget: string }
          - { name: hero_sub,      label: "Opening paragraph", widget: text, required: false, hint: "Leave empty to keep the wording that ships with the site." }
