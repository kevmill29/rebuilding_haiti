<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Received — Rebuilding Haiti</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F7F6EE; color:#241F1B;
         font-family:Newsreader,Georgia,serif; padding:2rem; }
  .card { max-width:34rem; border:3px solid #241F1B; background:#fff; padding:2.5rem; }
  .eyebrow { font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#B85042; margin:0; }
  h1 { font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:800; letter-spacing:-.03em;
       font-size:2.1rem; line-height:1.05; margin:.6rem 0 0; }
  p { line-height:1.65; color:rgba(36,31,27,.82); }
  a.btn { display:inline-block; margin-top:1.5rem; background:#B85042; color:#F7F6EE; text-decoration:none;
          font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:600; padding:.85rem 1.6rem; }
  a.btn:hover { background:#a2453a; }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Received</p>
    <h1>Thank you. We have it.</h1>
    <p>Someone from the project will reply to you directly. If it is urgent, the campaign page has a message
       button that reaches the organizer faster than email.</p>
    <a class="btn" href="/">Back to the site</a>
  </main>
</body>
</html>
